  ESC 退出流程 (逆序):
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    阶段3 ──ESC(第2次)──► 阶段2 ──ESC──► 阶段1 ──ESC──► 阶段0 ──ESC──► 关闭
      │                   │             │             │
      └──ESC(第1次)──► 显示提示          │             │
                         (2秒后自动消失)  │             │

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  现有 ESC 逻辑分析:
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    当前代码 (ScreenshotPreviewView.swift:264-305):

    1. 优先处理文本编辑状态 → 退出编辑
    2. 其次处理选中元素状态 → 取消选中
    3. 阶段转换:
       • editing → confirmCrop (阶段3 → 阶段2)
       • confirmCrop → 显示提示 / 第2次退出 (阶段2 → 退出) ✅ 已有双击逻辑
       • initialCrop → 直接退出 (阶段1 → 退出)

    需要修改:
       • confirmCrop → 返回 initialCrop (阶段2 → 阶段1) ❌ 当前是退出
       • initialCrop → 返回 windowDetection (阶段1 → 阶段0) ❌ 需要新增
       • windowDetection → 退出 (阶段0 → 关闭) ❌ 需要新增


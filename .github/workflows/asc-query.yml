name: ASC Status (manual)

# 手动触发：借 CI secrets 里的 ASC API 密钥查询 App Store Connect 状态（只读）
on:
  workflow_dispatch:

jobs:
  status:
    runs-on: macos-latest
    steps:
      - name: Query ASC
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          echo "$ASC_API_KEY_P8_BASE64" | base64 -d > /tmp/asc.p8
          cat > /tmp/jwt.py <<'PY'
import base64, json, time, subprocess, sys, os
key_id, issuer = os.environ["ASC_KEY_ID"], os.environ["ASC_ISSUER_ID"]
h = base64.urlsafe_b64encode(json.dumps({"alg":"ES256","kid":key_id,"typ":"JWT"}).encode()).rstrip(b"=")
p = base64.urlsafe_b64encode(json.dumps({"iss":issuer,"exp":int(time.time())+600,"aud":"appstoreconnect-v1"}).encode()).rstrip(b"=")
s = h + b"." + p
open("/tmp/sig_input","wb").write(s)
sig = subprocess.run(["openssl","dgst","-sha256","-sign","/tmp/asc.p8","/tmp/sig_input"],capture_output=True).stdout
print((s + b"." + base64.urlsafe_b64encode(sig).rstrip(b"=")).decode())
PY
          JWT=$(python3 /tmp/jwt.py)
          AUTH="Authorization: Bearer $JWT"
          echo "=== App 记录 ==="
          curl -sS -H "$AUTH" "https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=com.quitenote.app&limit=1" | python3 -m json.tool | head -30
          APP_ID=$(curl -sS -H "$AUTH" "https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=com.quitenote.app&limit=1" | python3 -c "import json,sys; print(json.load(sys.stdin)['data'][0]['id'])")
          echo "APP_ID=$APP_ID"
          echo "=== 版本记录 ==="
          curl -sS -H "$AUTH" "https://api.appstoreconnect.apple.com/v1/apps/$APP_ID/appStoreVersions?limit=10" | python3 -m json.tool | head -60
          echo "=== 构建 ==="
          curl -sS -H "$AUTH" "https://api.appstoreconnect.apple.com/v1/builds?filter[app]=$APP_ID&limit=10&sort=-uploadedDate" | python3 -c "
import json,sys
d = json.load(sys.stdin)
for b in d.get('data', []):
    a = b['attributes']
    print(a.get('version'), a.get('processingState'), a.get('uploadedDate'))
"

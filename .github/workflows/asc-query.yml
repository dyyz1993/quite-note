name: ASC Query (manual)

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: macos-latest
    steps:
      - name: Prepare key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: echo "$ASC_API_KEY_P8_BASE64" | base64 -d > /tmp/asc.p8

      - name: Build JWT
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > /tmp/jwt.py <<'PYEOF'
          import base64, json, time, subprocess, os
          key_id, issuer = os.environ["ASC_KEY_ID"], os.environ["ASC_ISSUER_ID"]
          h = base64.urlsafe_b64encode(json.dumps({"alg":"ES256","kid":key_id,"typ":"JWT"}).encode()).rstrip(b"=")
          p = base64.urlsafe_b64encode(json.dumps({"iss":issuer,"exp":int(time.time())+600,"aud":"appstoreconnect-v1"}).encode()).rstrip(b"=")
          s2 = h + b"." + p
          open("/tmp/sig_input","wb").write(s2)
          der = subprocess.run(["openssl","dgst","-sha256","-sign","/tmp/asc.p8","/tmp/sig_input"],capture_output=True).stdout
          def read_len(d, i):
              l = d[i]; i += 1
              if l & 0x80:
                  n = l & 0x7f; l = int.from_bytes(d[i:i+n],"big"); i += n
              return l, i
          i = 2
          ints = []
          for _ in range(2):
              i += 1
              l, i = read_len(der, i)
              v = der[i:i+l]; i += l
              ints.append(v.rjust(32, b"\x00")[-32:])
          raw = ints[0] + ints[1]
          print((s2 + b"." + base64.urlsafe_b64encode(raw).rstrip(b"=")).decode())
          PYEOF
          sed -i '' 's/^          //' /tmp/jwt.py
          python3 /tmp/jwt.py > /tmp/jwt.txt
          echo "JWT ready: $(wc -c < /tmp/jwt.txt) bytes"

      - name: Query ASC
        run: |
          JWT=$(cat /tmp/jwt.txt)
          AUTH="Authorization: Bearer $JWT"
          echo "=== App 记录 ==="
          curl -sSg -H "$AUTH" "https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=com.quitenote.app&limit=1" | python3 -m json.tool | head -30
          APP_ID=$(curl -sSg -H "$AUTH" "https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=com.quitenote.app&limit=1" | python3 -c "import json,sys; print(json.load(sys.stdin)['data'][0]['id'])")
          echo "APP_ID=$APP_ID"
          echo "=== 版本记录（状态与资料） ==="
          curl -sSg -H "$AUTH" "https://api.appstoreconnect.apple.com/v1/apps/$APP_ID/appStoreVersions?limit=10" | python3 -m json.tool | head -80
          echo "=== 构建列表 ==="
          curl -sSg -H "$AUTH" "https://api.appstoreconnect.apple.com/v1/builds?filter[app]=$APP_ID&limit=10&sort=-uploadedDate" | python3 -c "
          import json,sys
          d = json.load(sys.stdin)
          for b in d.get('data', []):
              a = b['attributes']
              print(a.get('version'), a.get('processingState'), a.get('uploadedDate'))
          "

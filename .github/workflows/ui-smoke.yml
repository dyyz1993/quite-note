name: UI Smoke

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dev-artifact:
    name: Build Dev UI Artifact
    # The app now requires the macOS 26 SDK; use GitHub's hosted macOS image.
    runs-on: [self-hosted, macos-heavy]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare CI keychain for codesigning
        env:
          QN_UI_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          QN_UI_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          CERT="$RUNNER_TEMP/qn-ui-certificate.p12"
          KEYCHAIN="$RUNNER_TEMP/qn-ui-signing.keychain-db"
          echo -n "$QN_UI_CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERT"
          security create-keychain -p "$QN_UI_CERTIFICATE_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$QN_UI_CERTIFICATE_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$QN_UI_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$QN_UI_CERTIFICATE_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login
          # Resolve a Developer ID identity from the temporary keychain.
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/{print $1; exit}' | awk '{print $2}')
          [[ -n "$IDENTITY" ]] || { echo "No Developer ID identity found"; exit 2; }
          echo "APP_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          rm -f "$CERT"

      - name: Build universal Dev app
        run: |
          uname -m
          # The UI smoke host is an Intel Mac, so the Dev app must contain an
          # x86_64 slice. A native-arch build here produces an arm64-only
          # binary and the smoke dies with "Bad CPU type in executable".
          swift build -c release --arch x86_64 --arch arm64 --product QuiteNote
          # Cross-arch builds use the Xcode backend, whose products live in
          # .build/apple/Products/Release/ rather than SwiftPM's plain layout.
          BINARY="$(find .build -type f -name QuiteNote -path '*/Products/Release/*' \
            ! -path '*/Intermediates.noindex/*' ! -path '*.dSYM*' -print -quit)"
          [[ -n "$BINARY" ]] || { echo "QuiteNote binary not found under .build"; exit 1; }
          echo "Using binary: $BINARY"
          # Fail fast if the artifact would not run on the Intel smoke host.
          lipo -info "$BINARY"
          lipo -info "$BINARY" | grep -q x86_64 || {
            echo "Binary has no x86_64 slice; the UI smoke host is Intel"; exit 1; }
          # build-app.sh looks for .build/apple/Products/Release first and then
          # .build/release. Cross-arch builds hardlink the product into
          # .build/release already, so only copy when it is not there yet;
          # "cp: identical (not copied)" would abort the step under set -e.
          if [[ ! -f ".build/release/QuiteNote" ]]; then
            mkdir -p .build/release
            cp "$BINARY" .build/release/QuiteNote
          fi
          lipo -info .build/release/QuiteNote
          [[ -n "$APP_SIGN_IDENTITY" ]] || { echo "APP_SIGN_IDENTITY was not prepared"; exit 2; }
          ./build-app.sh --dev --no-build --no-launch

      - name: Cleanup CI keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/qn-ui-signing.keychain-db" || true

      - name: Package artifact
        run: |
          ARTIFACT_NAME="QuiteNoteDev-${GITHUB_SHA::8}-universal.zip"
          ditto -c -k --keepParent "Quite Note Dev.app" "$ARTIFACT_NAME"
          shasum -a 256 "$ARTIFACT_NAME" > "$ARTIFACT_NAME.sha256"
          echo "UI_ARTIFACT=$ARTIFACT_NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.UI_ARTIFACT }}
          path: |
            QuiteNoteDev-*.zip
            QuiteNoteDev-*.zip.sha256
          retention-days: 30
          if-no-files-found: error

  remote-ui-smoke:
    name: Local UI Smoke on Dedicated Mac
    needs: build-dev-artifact
    runs-on: [self-hosted, quitenote-ui]
    steps:
      - uses: actions/checkout@v4

      - name: Test screenshot evidence tooling
        run: python3 -m unittest discover -s tools/ui-smoke -p 'test_evidence.py' -v

      - uses: actions/download-artifact@v4
        with:
          pattern: QuiteNoteDev-*.zip
          merge-multiple: true
          path: ${{ runner.temp }}/ui-artifact

      - name: Verify artifact
        run: |
          ARTIFACT="$(find "$RUNNER_TEMP/ui-artifact" -maxdepth 1 -name 'QuiteNoteDev-*.zip' -print -quit)"
          [[ -n "$ARTIFACT" ]] || { echo "Dev artifact was not downloaded" >&2; exit 2; }
          CHECKSUM="$(find "$RUNNER_TEMP/ui-artifact" -maxdepth 1 -name 'QuiteNoteDev-*.sha256' -print -quit)"
          [[ -n "$CHECKSUM" ]] || { echo "Dev artifact checksum was not downloaded" >&2; exit 2; }
          (cd "$RUNNER_TEMP/ui-artifact" && shasum -a 256 --check "$(basename "$CHECKSUM")")
          echo "UI_ARTIFACT=$ARTIFACT" >> "$GITHUB_ENV"

      - name: Update GUI smoke launcher
        run: ./tools/ui-smoke/install-quitenote-gui-launcher.sh

      - name: Run UI smoke from prebuilt artifact
        run: |
          ./tools/ui-smoke/run_ui_smoke.sh \
            --local-artifact "$UI_ARTIFACT" \
            --mode full \
            --evidence full \
            --ui-python "$HOME/Desktop/QuitenoteRunnerPython.app/Contents/MacOS/Python"

      - name: Check GUI launcher service
        run: |
          pgrep -f "[g]ui_smoke_launcher.py" >/dev/null

      - name: Compose screenshot timeline
        run: |
          RUN_DIR="$(find tools/ui-smoke/runs -maxdepth 1 -type d -name 'ui-*' -print -quit)"
          [[ -n "$RUN_DIR" ]] || { echo "UI run directory missing" >&2; exit 2; }
          if [[ -f "$RUN_DIR/recordings/frames.json" ]]; then
            python3 tools/ui-smoke/compose_timeline.py "$RUN_DIR"
          fi

      - name: Require visual evidence
        run: |
          RUN_DIR="$(find tools/ui-smoke/runs -maxdepth 1 -type d -name 'ui-*' -print -quit)"
          [[ -n "$RUN_DIR" ]] || { echo "UI run directory missing" >&2; exit 2; }
          python3 tools/ui-smoke/validate_evidence.py "$RUN_DIR"

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuiteNoteUI-${{ github.sha }}
          path: |
            tools/ui-smoke/runs/ui-*/manifest.json
            tools/ui-smoke/runs/ui-*/report.json
            tools/ui-smoke/runs/ui-*/report.md
            tools/ui-smoke/runs/ui-*/timeline.jsonl
            tools/ui-smoke/runs/ui-*/app.stdout.log
            tools/ui-smoke/runs/ui-*/app.stderr.log
            tools/ui-smoke/runs/ui-*/driver.stdout.log
            tools/ui-smoke/runs/ui-*/driver.stderr.log
            tools/ui-smoke/runs/ui-*/launcher.stderr.log
            tools/ui-smoke/runs/ui-*/launcher-error.txt
            tools/ui-smoke/runs/ui-*/screenshots/
            tools/ui-smoke/runs/ui-*/recordings/
            tools/ui-smoke/runs/ui-*/knowledge-candidate.md
          retention-days: 30
          if-no-files-found: warn

      # 成功时的截图基准快照：推到 gh-pages 的 ui-baseline/（持久，不受 artifact 30 天限制），
      # 供后续回归对比：https://dyyz1993.github.io/quite-note/ui-baseline/
      - name: Snapshot UI baseline (PASS only)
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          RUN_DIR="$(find tools/ui-smoke/runs -maxdepth 1 -type d -name 'ui-*' -print -quit)"
          [[ -n "$RUN_DIR" ]] || { echo "UI run directory missing" >&2; exit 2; }
          GH_DIR="$RUNNER_TEMP/gh-pages-baseline"
          git clone --depth 5 --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" "$GH_DIR" \
            || { echo "gh-pages 不存在，跳过基线快照"; exit 0; }
          python3 tools/ui-smoke/snapshot_ui_baseline.py "$RUN_DIR" "$GH_DIR" \
            || { echo "快照未生成（非 PASS？）"; exit 0; }
          cd "$GH_DIR"
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add ui-baseline
            git commit -m "ui-baseline: ${GITHUB_SHA::8} [skip ci]"
            git push origin gh-pages
            echo "基线已推送到 gh-pages"
          else
            echo "基线无变化"
          fi

name: UI Smoke

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dev-artifact:
    name: Build Dev UI Artifact
    # The app now requires the macOS 26 SDK; use GitHub's hosted macOS image.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Prepare CI keychain for codesigning
        env:
          QN_UI_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          QN_UI_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          CERT="$RUNNER_TEMP/qn-ui-certificate.p12"
          KEYCHAIN="$RUNNER_TEMP/qn-ui-signing.keychain-db"
          echo -n "$QN_UI_CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERT"
          security create-keychain -p "$QN_UI_CERTIFICATE_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$QN_UI_CERTIFICATE_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$QN_UI_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$QN_UI_CERTIFICATE_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login
          # Resolve a Developer ID identity from the temporary keychain.
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/{print $1; exit}' | awk '{print $2}')
          [[ -n "$IDENTITY" ]] || { echo "No Developer ID identity found"; exit 2; }
          echo "APP_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          rm -f "$CERT"

      - name: Build universal Dev app
        run: |
          uname -m
          swift build -c release --arch x86_64 --arch arm64 --product QuiteNote
          mkdir -p .build/release
          cp .build/apple/Products/Release/QuiteNote .build/release/QuiteNote
          [[ -n "$APP_SIGN_IDENTITY" ]] || { echo "APP_SIGN_IDENTITY was not prepared"; exit 2; }
          ./build-app.sh --dev --no-build --no-launch

      - name: Cleanup CI keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/qn-ui-signing.keychain-db" || true

      - name: Package artifact
        run: |
          ARTIFACT_NAME="QuiteNoteDev-${GITHUB_SHA::8}-universal.zip"
          ditto -c -k --keepParent "Quite Note Dev.app" "$ARTIFACT_NAME"
          shasum -a 256 "$ARTIFACT_NAME" > "$ARTIFACT_NAME.sha256"
          echo "UI_ARTIFACT=$ARTIFACT_NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.UI_ARTIFACT }}
          path: |
            QuiteNoteDev-*.zip
            QuiteNoteDev-*.zip.sha256
          retention-days: 30
          if-no-files-found: error

  remote-ui-smoke:
    name: Local UI Smoke on Dedicated Mac
    needs: build-dev-artifact
    runs-on: [self-hosted, quitenote-ui]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: QuiteNoteDev-*.zip
          merge-multiple: true
          path: ${{ runner.temp }}/ui-artifact

      - name: Verify artifact
        run: |
          ARTIFACT="$(find "$RUNNER_TEMP/ui-artifact" -maxdepth 1 -name 'QuiteNoteDev-*.zip' -print -quit)"
          [[ -n "$ARTIFACT" ]] || { echo "Dev artifact was not downloaded" >&2; exit 2; }
          CHECKSUM="$(find "$RUNNER_TEMP/ui-artifact" -maxdepth 1 -name 'QuiteNoteDev-*.sha256' -print -quit)"
          [[ -n "$CHECKSUM" ]] || { echo "Dev artifact checksum was not downloaded" >&2; exit 2; }
          (cd "$RUNNER_TEMP/ui-artifact" && shasum -a 256 --check "$(basename "$CHECKSUM")")
          echo "UI_ARTIFACT=$ARTIFACT" >> "$GITHUB_ENV"

      - name: Run UI smoke from prebuilt artifact
        run: |
          ./tools/ui-smoke/run_ui_smoke.sh \
            --local-artifact "$UI_ARTIFACT" \
            --mode full \
            --evidence full

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuiteNoteUI-${{ github.sha }}
          path: |
            tools/ui-smoke/runs/ui-*/manifest.json
            tools/ui-smoke/runs/ui-*/report.json
            tools/ui-smoke/runs/ui-*/report.md
            tools/ui-smoke/runs/ui-*/timeline.jsonl
            tools/ui-smoke/runs/ui-*/app.stdout.log
            tools/ui-smoke/runs/ui-*/app.stderr.log
            tools/ui-smoke/runs/ui-*/screenshots/
            tools/ui-smoke/runs/ui-*/recordings/
            tools/ui-smoke/runs/ui-*/knowledge-candidate.md
          retention-days: 30
          if-no-files-found: warn

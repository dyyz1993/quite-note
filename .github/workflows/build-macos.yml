name: Build macOS App

# 纯构建流水线：push/PR 时云端构建 + 打 DMG + 上传产物（ad-hoc 签名，仅自测用）
# ⚠️ 正式的「签名 + 公证 + Release」由 release.yml 负责（打 v*.*.* 标签触发）
#   本 workflow 不再创建 GitHub Release，避免未签名版本与签名版本混淆

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: 安装ImageMagick（用于图标转换）
      run: |
        brew install imagemagick

    - name: 验证Swift Package
      run: |
        swift package resolve

    - name: 构建Release版本
      run: |
        swift build -c release --product QuiteNote

    - name: 创建应用包结构
      run: |
        chmod +x build-app.sh
        ./build-app.sh --no-launch

    - name: 验证应用包
      run: |
        ls -la "Quite Note.app/Contents/"
        file "Quite Note.app/Contents/MacOS/QuiteNote"

    - name: 创建DMG安装包
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION="1.0.0"
        fi
        echo "版本: $VERSION"
        chmod +x create-dmg.sh
        ./create-dmg.sh "$VERSION"
        DMG_FILE="QuiteNote-$VERSION.dmg"
        if [ -f "$DMG_FILE" ]; then
          echo "✅ DMG 创建成功:"
          ls -la QuiteNote-*.dmg
        else
          echo "❌ DMG 创建失败"
          exit 1
        fi

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: QuiteNote-macOS-DMG-${{ github.run_number }}
        path: |
          QuiteNote-*.dmg
        retention-days: 30
        if-no-files-found: error

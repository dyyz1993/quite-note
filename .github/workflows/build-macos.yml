name: Build macOS App

# 纯构建流水线：push/PR 时云端构建 + 打 DMG + 上传产物（ad-hoc 签名，仅自测用）
# ⚠️ 正式的「签名 + 公证 + Release」由 release.yml 负责（打 v*.*.* 标签触发）
#   本 workflow 不再创建 GitHub Release，避免未签名版本与签名版本混淆

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: [self-hosted, macos-heavy]

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    # 自托管 runner 的 job 上下文访问不了登录钥匙串的私钥（签名报
    # errSecInternalComponent，2026-11-25 实锤）：与 ui-smoke.yml 同款，把仓库
    # secrets 里的 Developer ID 证书导入临时钥匙串（job 结束销毁，不落盘）。
    # list-keychains 必须写完整路径——裸写 "login" 会把真钥匙串挤出搜索列表
    - name: Prepare CI keychain for codesigning
      env:
        QN_BUILD_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
        QN_BUILD_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      run: |
        CERT="$RUNNER_TEMP/qn-build-certificate.p12"
        KEYCHAIN="$RUNNER_TEMP/qn-build-signing.keychain-db"
        echo -n "$QN_BUILD_CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERT"
        security create-keychain -p "$QN_BUILD_CERTIFICATE_PASSWORD" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$QN_BUILD_CERTIFICATE_PASSWORD" "$KEYCHAIN"
        security import "$CERT" -P "$QN_BUILD_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$QN_BUILD_CERTIFICATE_PASSWORD" "$KEYCHAIN"
        security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
        IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN"           | awk -F'"' '/Developer ID Application/{print $2; exit}' | head -1)
        [[ -n "$IDENTITY" ]] || { echo "No Developer ID identity found"; exit 2; }
        echo "APP_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
        rm -f "$CERT"

    - name: 设置Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: 安装ImageMagick（用于图标转换）
      run: |
        brew install imagemagick

    # 自托管 runner 依赖预热（2026-11-20）：GitHub runner 每个 job 覆盖 HOME，
    # SwiftPM 用户级缓存（lucide 镜像仓库 + Sparkle 二进制产物）不可见，而本机
    # 直连 GitHub releases/codeload 不稳（大包断流）。从真实用户的缓存目录拷入
    # job HOME → resolve 全程零网络。真实目录由开发机维护（见 ERRORS.md 11-19/20）
    - name: 预热 SwiftPM 依赖缓存（自托管）
      run: |
        SRC="/Users/xuyingzhou/Library/Caches/org.swift.swiftpm"
        DST="$HOME/Library/Caches/org.swift.swiftpm"
        if [ -d "$SRC" ]; then
          mkdir -p "$DST"
          rsync -a --delete "$SRC/repositories/" "$DST/repositories/" 2>/dev/null || true
          rsync -a "$SRC/artifacts/" "$DST/artifacts/" 2>/dev/null || true
          echo "SwiftPM cache primed: $(ls "$DST/repositories" 2>/dev/null | wc -l | tr -d ' ') repos, $(ls "$DST/artifacts" 2>/dev/null | wc -l | tr -d ' ') artifacts"

          # Sparkle 二进制产物从本机镜像灌入（真实缓存会被 SwiftPM 在下载失败时清除，
          # 2026-11-20 实锤 artifacts=0；镜像目录见 /Users/xuyingzhou/runners/swiftpm-mirror）
          SPARKLE_KEY="https___github_com_sparkle_project_Sparkle_releases_download_2_10_0_Sparkle_for_Swift_Package_Manager_zip"
                  # 旧 mangle（_<十进制>_）一并放入：不同工具链版本 mangle 规则不同，双保险
                  SPARKLE_KEY_LEGACY="https_58__47__47_github_46_com_47_sparkle_45_project_47_Sparkle_47_releases_47_download_47_2_46_10_46_0_47_Sparkle_45_for_45_Swift_45_Package_45_Manager_46_zip"
                  MIRROR="/Users/xuyingzhou/runners/swiftpm-mirror/sparkle-2.10.0.zip"
                  if [ -f "$MIRROR" ]; then
                    mkdir -p "$DST/artifacts"
                    cp "$MIRROR" "$DST/artifacts/$SPARKLE_KEY"
                    cp "$MIRROR" "$DST/artifacts/$SPARKLE_KEY_LEGACY"
                    echo "Sparkle artifact primed from mirror"
                  fi
        else
          echo "WARN: 开发机 SwiftPM 缓存不存在，回退网络下载"
        fi

    - name: 验证Swift Package
      run: |
        swift package resolve

    - name: 构建Release版本
      run: |
        swift build -c release --product QuiteNote

    - name: 创建应用包结构
      run: |
        chmod +x build-app.sh
        ./build-app.sh --no-launch

    - name: 验证应用包
      run: |
        ls -la "Quite Note.app/Contents/"
        file "Quite Note.app/Contents/MacOS/QuiteNote"

    - name: 创建DMG安装包
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION="1.0.0"
        fi
        echo "版本: $VERSION"
        chmod +x create-dmg.sh
        ./create-dmg.sh "$VERSION"
        DMG_FILE="QuiteNote-$VERSION.dmg"
        if [ -f "$DMG_FILE" ]; then
          echo "✅ DMG 创建成功:"
          ls -la QuiteNote-*.dmg
        else
          echo "❌ DMG 创建失败"
          exit 1
        fi

    - name: Cleanup CI keychain
      if: always()
      run: |
        security delete-keychain "$RUNNER_TEMP/qn-build-signing.keychain-db" || true

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: QuiteNote-macOS-DMG-${{ github.run_number }}
        path: |
          QuiteNote-*.dmg
        retention-days: 30
        if-no-files-found: error

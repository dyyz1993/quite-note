name: Build macOS App

# 纯构建流水线：push/PR 时云端构建 + 打 DMG + 上传产物（ad-hoc 签名，仅自测用）
# ⚠️ 正式的「签名 + 公证 + Release」由 release.yml 负责（打 v*.*.* 标签触发）
#   本 workflow 不再创建 GitHub Release，避免未签名版本与签名版本混淆

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: [self-hosted, macos-heavy]
    # A pull request from a fork must never run on the self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    # 自托管 runner 的 job 上下文访问不了登录钥匙串的私钥（签名报
    # errSecInternalComponent，2026-11-25 实锤）：把仓库 secrets 里的 Developer ID 证书
    # 导入临时钥匙串（job 结束销毁，不落盘）。实现与 release.yml / ui-smoke.yml 共用
    # tools/ci-signing.sh（钥匙串搜索列表那个坑写在那里的注释里）
    - name: Prepare CI keychain for codesigning
      env:
        QN_BUILD_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
        QN_BUILD_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      run: |
        source "$GITHUB_WORKSPACE/tools/ci-signing.sh"
        ci_signing_prepare "$QN_BUILD_CERTIFICATE_P12_BASE64" "$QN_BUILD_CERTIFICATE_PASSWORD" "$QN_BUILD_CERTIFICATE_PASSWORD"

    - name: 设置Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: 安装ImageMagick（用于图标转换）
      run: |
        # 自托管机器是常驻的：装过就别再碰 brew（brew install 对已安装的包也要 30 多秒）
        if command -v magick >/dev/null 2>&1 || command -v convert >/dev/null 2>&1; then
          echo "ImageMagick 已安装：$(command -v magick || command -v convert)"
        else
          brew install imagemagick
        fi

    # 预热背景与实现见 tools/ci-prewarm-swiftpm.sh 头注释（2026-11-28 从三份内联拷贝
    # 收拢成一份，与 ci-signing.sh 同理；真实目录由开发机维护，见 ERRORS.md 11-19/20）
    - name: 预热 SwiftPM 依赖缓存（自托管）
      run: |
        source "$GITHUB_WORKSPACE/tools/ci-prewarm-swiftpm.sh"
        ci_swiftpm_prewarm

    - name: 验证Swift Package
      run: |
        swift package resolve

    # 不在这里先 `swift build` 一次：编译条件（LEGACY_CI_SDK 等）和 build-app.sh 里的不一致，
    # 之前这一步编出来的东西会被 build-app.sh 原样重编一遍，白花 1 分半（2026-11-27 实测）
    - name: 创建应用包结构
      run: |
        chmod +x build-app.sh
        ./build-app.sh --no-launch

    - name: 验证应用包
      run: |
        ls -la "Quite Note.app/Contents/"
        file "Quite Note.app/Contents/MacOS/QuiteNote"

    - name: 创建DMG安装包
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION="1.0.0"
        fi
        echo "版本: $VERSION"
        chmod +x create-dmg.sh
        ./create-dmg.sh "$VERSION"
        DMG_FILE="QuiteNote-$VERSION.dmg"
        if [ -f "$DMG_FILE" ]; then
          echo "✅ DMG 创建成功:"
          ls -la QuiteNote-*.dmg
        else
          echo "❌ DMG 创建失败"
          exit 1
        fi

    - name: Cleanup CI keychain
      if: always()
      run: |
        source "$GITHUB_WORKSPACE/tools/ci-signing.sh"
        ci_signing_cleanup

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: QuiteNote-macOS-DMG-${{ github.run_number }}
        path: |
          QuiteNote-*.dmg
        retention-days: 30
        if-no-files-found: error

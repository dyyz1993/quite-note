name: Build macOS App

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: 安装ImageMagick（用于图标转换）
      run: |
        brew install imagemagick
        
    - name: 验证Swift Package
      run: |
        swift package resolve
        
    - name: 构建Release版本
      run: |
        swift build -c release --product QuiteNote
        
    - name: 创建应用包结构
      run: |
        chmod +x build-app.sh
        ./build-app.sh
        
    - name: 验证应用包
      run: |
        ls -la "Quite Note.app/Contents/"
        file "Quite Note.app/Contents/MacOS/QuiteNote"
        
    - name: 创建DMG安装包
      run: |
        # 获取版本号
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION="1.0.0"
        fi
        echo "🔍 检查DMG创建脚本... (版本: $VERSION)"
        if [ -f "create-dmg.sh" ]; then
          echo "✅ 找到DMG创建脚本"
          chmod +x create-dmg.sh
          echo "🚀 开始创建DMG..."
          ./create-dmg.sh $VERSION
          echo "🔍 检查DMG文件..."
          DMG_FILE="QuiteNote-$VERSION.dmg"
          if [ -f "$DMG_FILE" ]; then
            echo "✅ DMG创建成功:"
            ls -la QuiteNote-*.dmg
            # 验证DMG文件
            echo "🔍 验证DMG文件完整性..."
            hdiutil attach -quiet -readonly -mountpoint /tmp/dmg_test "$DMG_FILE"
            if [ -d "/tmp/dmg_test/Quite Note.app" ]; then
              echo "✅ DMG文件验证成功，应用包完整"
            else
              echo "❌ DMG文件验证失败"
              exit 1
            fi
            hdiutil detach -quiet /tmp/dmg_test
          else
            echo "❌ DMG创建失败"
            exit 1
          fi
        else
          echo "❌ DMG创建脚本不存在，跳过DMG生成"
        fi
        
    - name: 检查构建产物
      run: |
        # 获取版本号
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION="1.0.0"
        fi
        echo "📁 当前目录内容:"
        ls -la
        echo ""
        echo "🔍 检查应用包:"
        if [ -d "Quite Note.app" ]; then
          echo "✅ 应用包存在: Quite Note.app"
          ls -la "Quite Note.app/Contents/"
        else
          echo "❌ 应用包不存在"
        fi
        echo ""
        echo "🔍 检查DMG文件:"
        DMG_FILE="QuiteNote-$VERSION.dmg"
        if [ -f "$DMG_FILE" ]; then
          echo "✅ DMG文件存在 ($DMG_FILE):"
          ls -la QuiteNote-*.dmg
        else
          echo "❌ DMG文件不存在 ($DMG_FILE)"
          echo "🔍 查找所有DMG文件:"
          find . -name "*.dmg" -ls 2>/dev/null || echo "没有找到任何DMG文件"
        fi
        
    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: QuiteNote-macOS-DMG-${{ github.run_number }}
        path: |
          QuiteNote-*.dmg
        retention-days: 30
        if-no-files-found: error
        
    - name: 上传应用包（备用）
      uses: actions/upload-artifact@v4
      with:
        name: QuiteNote-macOS-APP-${{ github.run_number }}
        path: |
          Quite Note.app
        retention-days: 7
        if-no-files-found: warn
      continue-on-error: true
        
    - name: 获取版本信息
      id: version
      run: |
        if [ -f "Package.swift" ]; then
          VERSION=$(grep -o 'version: "[^"]*"' Package.swift | head -1 | cut -d'"' -f2)
        else
          VERSION="1.0.0"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        
    - name: 创建GitHub Release (Tag推送)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          QuiteNote-*.dmg
          Quite Note.app
        generate_release_notes: true
        draft: false
        prerelease: false
        name: Quite Note ${{ github.ref_name }}
        body: |
          🎉 **Quite Note ${{ github.ref_name }} 发布**
          
          基于SwiftUI的macOS剪切板历史记录和AI提炼工具
          
          ## 📦 下载文件（推荐顺序）
          ### 🥇 **DMG安装包（推荐用户使用）**
          - `QuiteNote-*.dmg` - 一键安装包，包含应用程序和Applications快捷方式
          
          ### 🥈 **应用包（高级用户）**
          - `Quite Note.app` - 完整的macOS应用包
          
          ## 🚀 安装说明
          ### DMG安装（推荐）⭐
          1. 下载 `QuiteNote-*.dmg` 文件
          2. 双击DMG文件挂载
          3. 将 "Quite Note.app" 拖拽到 "Applications" 文件夹
          4. 在 Launchpad 或 Applications 文件夹中启动应用
          5. 首次运行时，如遇安全提示，请在 "系统偏好设置 > 安全性与隐私" 中允许
          
          ### 应用包安装（高级用户）
          1. 下载 `Quite Note.app` 文件
          2. 手动移动到 Applications 文件夹
          3. 右键点击应用，选择"打开"
          
          ## ✨ 主要功能
          - 🎨 自定义剪切板+AI闪光主题图标
          - 🔧 改进的LucideIcons加载机制（修复第三方图标打包问题）
          - 📱 优化的状态栏图标显示
          - 📋 完整的剪切板历史记录管理
          - 🤖 AI内容提炼功能
          - 🔒 完整的代码签名，避免"损坏"提示
          
          ## 🔧 系统要求
          - macOS 12.0 或更高版本
          - 支持Intel和Apple Silicon（通用二进制）
          
          ---
          📅 构建时间: ${{ github.event.head_commit.timestamp }}
          🔗 提交哈希: ${{ github.sha }}
          🏷️ 构建编号: ${{ github.run_number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 创建自动Release (主分支推送)
      if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          QuiteNote-*.dmg
          Quite Note.app
        generate_release_notes: true
        draft: false
        prerelease: false
        name: Quite Note Auto-Build ${{ github.run_number }}
        tag_name: auto-build-${{ github.run_number }}
        body: |
          🚀 **Quite Note 自动构建版本 ${{ github.run_number }}**
          
          基于SwiftUI的macOS剪切板历史记录和AI提炼工具
          
          ## 📦 下载文件（推荐顺序）
          ### 🥇 **DMG安装包（推荐用户使用）**
          - `QuiteNote-*.dmg` - 一键安装包，包含应用程序和Applications快捷方式
          
          ### 🥈 **应用包（高级用户）**
          - `Quite Note.app` - 完整的macOS应用包
          
          ## 🚀 安装说明
          ### DMG安装（推荐）⭐
          1. 下载 `QuiteNote-*.dmg` 文件
          2. 双击DMG文件挂载
          3. 将 "Quite Note.app" 拖拽到 "Applications" 文件夹
          4. 在 Launchpad 或 Applications 文件夹中启动应用
          5. 首次运行时，如遇安全提示，请在 "系统偏好设置 > 安全性与隐私" 中允许
          
          ### 应用包安装（高级用户）
          1. 下载 `Quite Note.app` 文件
          2. 手动移动到 Applications 文件夹
          3. 右键点击应用，选择"打开"
          
          ## ✨ 主要功能
          - 🎨 自定义剪切板+AI闪光主题图标
          - 🔧 改进的LucideIcons加载机制（修复第三方图标打包问题）
          - 📱 优化的状态栏图标显示
          - 📋 完整的剪切板历史记录管理
          - 🤖 AI内容提炼功能
          - 🔒 完整的代码签名，避免"损坏"提示
          
          ## 🔧 系统要求
          - macOS 12.0 或更高版本
          - 支持Intel和Apple Silicon（通用二进制）
          
          ---
          📅 构建时间: ${{ github.event.head_commit.timestamp }}
          🔗 提交哈希: ${{ github.sha }}
          🏷️ 构建编号: ${{ github.run_number }}
          📋 分支: ${{ github.ref_name }}
          
          ---
          💡 **注意**: 这是自动构建版本，包含最新的功能和修复。如需稳定版本，请查看带版本号的 Release。

    - name: 构建信息
      if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
      run: |
        echo "## 🚀 QuiteNote macOS 应用构建完成" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 构建产物" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ 应用包: Quite Note.app" >> $GITHUB_STEP_SUMMARY
        if [ -f "QuiteNote-1.0.0.dmg" ]; then
          echo "- ✅ 安装包: $(ls QuiteNote-*.dmg)" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔧 构建信息" >> $GITHUB_STEP_SUMMARY
        echo "- 📅 构建时间: ${{ github.event.head_commit.timestamp }}" >> $GITHUB_STEP_SUMMARY
        echo "- 🔗 提交哈希: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- 🏷️ 构建编号: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "- 📱 版本号: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📥 下载方式" >> $GITHUB_STEP_SUMMARY
        echo "1. 访问 Actions 页面" >> $GITHUB_STEP_SUMMARY
        echo "2. 点击此工作流的构建任务" >> $GITHUB_STEP_SUMMARY
        echo "3. 在 'Artifacts' 部分下载构建产物" >> $GITHUB_STEP_SUMMARY
  feishu-notify:
    name: Feishu Notification
    if: always()
    needs: [build-macos]
    uses: dyyz1993/ci-tools/.github/workflows/feishu-notify.yml@main
    with:
      jobs: '{"build-macos":"${{ needs.build-macos.result }}"}'
      sha: ${{ github.sha }}
      ref: ${{ github.ref_name }}
      actor: ${{ github.actor }}
      repo: ${{ github.repository }}
      run-id: ${{ github.run_id }}
    secrets:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

name: Tests

on:
  workflow_dispatch: {}
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    # Compile on a hosted Xcode image; the dedicated UI Mac only runs prebuilt apps.
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 验证 Xcode 和 Swift 工具链
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-platform-path
          xcrun --sdk macosx --show-sdk-version
          swift --version

      - name: 缓存 SwiftPM 构建产物
        uses: actions/cache@v4
        with:
          path: .build
          key: swift-build-${{ runner.os }}-${{ runner.arch }}-macos15-xcode16.4-${{ hashFiles('Package.swift', 'Package.resolved') }}

      - name: 运行全部单元测试
        # SpeechAnalyzer/SpeechTranscriber require the macOS 26 SDK. This
        # Xcode 16.4 compatibility lane uses the unavailable stub while
        # production builds retain the real speech implementation.
        run: >-
          swift test
          -Xswiftc -D -Xswiftc LEGACY_CI_SDK
          -Xswiftc -Xfrontend -Xswiftc -solver-expression-time-threshold=1000

  feishu-notify:
    name: Feishu Notification
    if: always()
    needs: [unit-tests]
    uses: dyyz1993/ci-tools/.github/workflows/feishu-notify.yml@main
    with:
      jobs: '{"unit-tests":"${{ needs.unit-tests.result }}"}'
      sha: ${{ github.sha }}
      ref: ${{ github.ref_name }}
      actor: ${{ github.actor }}
      repo: ${{ github.repository }}
      run-id: ${{ github.run_id }}
    secrets:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

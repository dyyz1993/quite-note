name: Tests

on:
  workflow_dispatch: {}
  push:
    # 只在主干上跑 push 这一套；PR 分支由 pull_request 触发（两套都跑会让串行的
    # 自托管 runner 时间翻倍，见 ui-smoke.yml 同处说明）
    branches: [main, master]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: [self-hosted, macos-heavy]
    # A pull request from a fork must never run on the self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 自托管 runner 依赖预热（2026-11-20）：GitHub runner 每个 job 覆盖 HOME，
      # SwiftPM 用户级缓存（lucide 镜像仓库 + Sparkle 二进制产物）不可见，而本机
      # 直连 GitHub releases/codeload 不稳（大包断流）。从真实用户的缓存目录拷入
      # job HOME → resolve 全程零网络。真实目录由开发机维护（见 ERRORS.md 11-19/20）
      - name: 预热 SwiftPM 依赖缓存（自托管）
        run: |
          SRC="/Users/xuyingzhou/Library/Caches/org.swift.swiftpm"
          DST="$HOME/Library/Caches/org.swift.swiftpm"
          if [ -d "$SRC" ]; then
            mkdir -p "$DST"
            rsync -a --delete "$SRC/repositories/" "$DST/repositories/" 2>/dev/null || true
            rsync -a "$SRC/artifacts/" "$DST/artifacts/" 2>/dev/null || true
            echo "SwiftPM cache primed: $(ls "$DST/repositories" 2>/dev/null | wc -l | tr -d ' ') repos, $(ls "$DST/artifacts" 2>/dev/null | wc -l | tr -d ' ') artifacts"

            # Sparkle 二进制产物从本机镜像灌入（真实缓存会被 SwiftPM 在下载失败时清除，
            # 2026-11-20 实锤 artifacts=0；镜像目录见 /Users/xuyingzhou/runners/swiftpm-mirror）
            SPARKLE_KEY="https___github_com_sparkle_project_Sparkle_releases_download_2_10_0_Sparkle_for_Swift_Package_Manager_zip"
                    # 旧 mangle（_<十进制>_）一并放入：不同工具链版本 mangle 规则不同，双保险
                    SPARKLE_KEY_LEGACY="https_58__47__47_github_46_com_47_sparkle_45_project_47_Sparkle_47_releases_47_download_47_2_46_10_46_0_47_Sparkle_45_for_45_Swift_45_Package_45_Manager_46_zip"
                    MIRROR="/Users/xuyingzhou/runners/swiftpm-mirror/sparkle-2.10.0.zip"
                    if [ -f "$MIRROR" ]; then
                      mkdir -p "$DST/artifacts"
                      cp "$MIRROR" "$DST/artifacts/$SPARKLE_KEY"
                      cp "$MIRROR" "$DST/artifacts/$SPARKLE_KEY_LEGACY"
                      echo "Sparkle artifact primed from mirror"
                    fi
          else
            echo "WARN: 开发机 SwiftPM 缓存不存在，回退网络下载"
          fi

      - name: 运行全部单元测试
        # SpeechAnalyzer/SpeechTranscriber require the macOS 26 SDK; GitHub's
        # macos-15 runner stays on the older SDK. Compile the speech path down
        # to an unavailable stub there while retaining production availability.
        # --scratch-path 指到工作区外面（自托管机器常驻，目录不会被下一次检出清掉）：
        # 构建状态一直在磁盘上，每次只重编改过的文件。此前用 actions/cache 还原一份按
        # Package.resolved 做键的 .build 快照——还原要 1 分 45 秒，且快照只在依赖变化时
        # 更新，等于每次都从旧状态重编（2026-11-27 实测：单测 job 6 分钟里测试本身 25 秒）
        run: >-
          swift test
          --scratch-path /Users/xuyingzhou/runners/qn-build/debug-tests
          -Xswiftc -D -Xswiftc LEGACY_CI_SDK
          -Xswiftc -Xfrontend -Xswiftc -solver-expression-time-threshold=1000

  feishu-notify:
    name: Feishu Notification
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [unit-tests]
    uses: dyyz1993/ci-tools/.github/workflows/feishu-notify.yml@main
    with:
      jobs: '{"unit-tests":"${{ needs.unit-tests.result }}"}'
      sha: ${{ github.sha }}
      ref: ${{ github.ref_name }}
      actor: ${{ github.actor }}
      repo: ${{ github.repository }}
      run-id: ${{ github.run_id }}
    secrets:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

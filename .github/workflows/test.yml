name: Tests

on:
  workflow_dispatch: {}
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: [self-hosted, macos-heavy]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 缓存 SwiftPM 构建产物
        uses: actions/cache@v4
        with:
          path: .build
          # The key must include the toolchain: .build/out holds
          # SDKExplicitPrecompiledModules, whose .pcm files are only valid for
          # the Xcode/SDK that produced them. Reusing them across an Xcode
          # upgrade fails the build with "module file ... .pcm not found".
          key: swift-build-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-${{ hashFiles('Package.swift') }}
          restore-keys: |
            swift-build-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-

      - name: 清除失效的显式模块缓存
        # Belt-and-braces: a restored cache from an older toolchain can still
        # contain precompiled modules for a different SDK. Drop them so the
        # build regenerates them against the current toolchain.
        run: rm -rf .build/out/SDKExplicitPrecompiledModules .build/out/ModuleCache.noindex

      - name: 运行全部单元测试
        # SpeechAnalyzer/SpeechTranscriber require the macOS 26 SDK; GitHub's
        # macos-15 runner stays on the older SDK. Compile the speech path down
        # to an unavailable stub there while retaining production availability.
        run: >-
          swift test
          -Xswiftc -D -Xswiftc LEGACY_CI_SDK
          -Xswiftc -Xfrontend -Xswiftc -solver-expression-time-threshold=1000

  feishu-notify:
    name: Feishu Notification
    if: always()
    needs: [unit-tests]
    uses: dyyz1993/ci-tools/.github/workflows/feishu-notify.yml@main
    with:
      jobs: '{"unit-tests":"${{ needs.unit-tests.result }}"}'
      sha: ${{ github.sha }}
      ref: ${{ github.ref_name }}
      actor: ${{ github.actor }}
      repo: ${{ github.repository }}
      run-id: ${{ github.run_id }}
    secrets:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

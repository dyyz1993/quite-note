name: Tests

on:
  workflow_dispatch: {}
  push:
    # 只在主干上跑 push 这一套；PR 分支由 pull_request 触发（两套都跑会让串行的
    # 自托管 runner 时间翻倍，见 ui-smoke.yml 同处说明）
    branches: [main, master]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: [self-hosted, macos-heavy]
    # A pull request from a fork must never run on the self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 预热背景与实现见 tools/ci-prewarm-swiftpm.sh 头注释（2026-11-28 从三份内联拷贝
      # 收拢成一份，与 ci-signing.sh 同理；真实目录由开发机维护，见 ERRORS.md 11-19/20）
      - name: 预热 SwiftPM 依赖缓存（自托管）
        run: |
          source "$GITHUB_WORKSPACE/tools/ci-prewarm-swiftpm.sh"
          ci_swiftpm_prewarm

      - name: 运行全部单元测试
        # SpeechAnalyzer/SpeechTranscriber require the macOS 26 SDK; GitHub's
        # macos-15 runner stays on the older SDK. Compile the speech path down
        # to an unavailable stub there while retaining production availability.
        # --scratch-path 指到工作区外面（自托管机器常驻，目录不会被下一次检出清掉）：
        # 构建状态一直在磁盘上，每次只重编改过的文件。此前用 actions/cache 还原一份按
        # Package.resolved 做键的 .build 快照——还原要 1 分 45 秒，且快照只在依赖变化时
        # 更新，等于每次都从旧状态重编（2026-11-27 实测：单测 job 6 分钟里测试本身 25 秒）
        run: >-
          swift test
          --scratch-path /Users/xuyingzhou/runners/qn-build/debug-tests
          -Xswiftc -D -Xswiftc LEGACY_CI_SDK
          -Xswiftc -Xfrontend -Xswiftc -solver-expression-time-threshold=1000

  feishu-notify:
    name: Feishu Notification
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [unit-tests]
    uses: dyyz1993/ci-tools/.github/workflows/feishu-notify.yml@main
    with:
      jobs: '{"unit-tests":"${{ needs.unit-tests.result }}"}'
      sha: ${{ github.sha }}
      ref: ${{ github.ref_name }}
      actor: ${{ github.actor }}
      repo: ${{ github.repository }}
      run-id: ${{ github.run_id }}
    secrets:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

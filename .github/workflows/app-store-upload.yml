name: App Store Upload (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: true
        default: '1.1.0'

jobs:
  upload:
    runs-on: macos-latest
    steps:
      - name: 下载 pkg
        run: |
          curl -sL -o "QuiteNote-${{ inputs.version }}-macOS.pkg" "https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version }}-upload/QuiteNote-${{ inputs.version }}-macOS.pkg"
          ls -lh QuiteNote-*.pkg

      - name: 安装 ASC 密钥
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY_P8_BASE64" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: 上传到 App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool \
            --upload-package "QuiteNote-${{ inputs.version }}-macOS.pkg" \
            --type macos \
            --api-key "$ASC_KEY_ID" \
            --api-issuer "$ASC_ISSUER_ID" 2>&1 | tail -5

      - name: 清理临时 Release
        run: gh release delete "v${{ inputs.version }}-upload" --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# QuiteNote GitLab CI 配置
#
# 启用前提（一次性，详见 AGENTS.md「CI/CD 自动化」）：
#   1. 仓库推送到 GitLab（gitlab.com 建仓后 push）
#   2. 一台常开的 Mac 注册 self-hosted runner（GitLab 免费版不提供托管 macOS runner）：
#      brew install gitlab-runner
#      gitlab-runner register   # executor: shell, tag: macos
#   3. Runner 机器钥匙串导入 Developer ID Application 证书（.p12）
#   4. Runner 机器存公证凭据（App Store Connect API Key 方式，命令见 AGENTS.md）
#
# 效果：
#   - push / MR → 自动跑全部单元测试，并生成 Dev ZIP 供 xyz-mac UI 回归拉取
#   - git tag v1.3.0 && git push <gitlab-remote> v1.3.0
#     → 自动执行 build-release.sh（构建 → Developer ID 签名 → 公证 → DMG），产物保留 30 天

stages:
  - test
  - ui-artifact
  - release

# 每次 push / MR：跑全部单元测试（含 OCR/马赛克/导出等 25 个用例）
run-tests:
  stage: test
  tags: [macos]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  script:
    - uname -m
    - swift test
  cache:
    key: swift-build-$CI_PROJECT_PATH
    paths:
      - .build/

# UI 冒烟专用 Dev ZIP：ZIP 内根层必须是「Quite Note Dev.app」。
# xyz-mac 是 Intel Mac；Runner 必须是 x86_64 或 universal构建。
dev-ui-artifact:
  stage: ui-artifact
  tags: [macos]
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  script:
    - uname -m
    - ./build-app.sh --dev --no-launch
    - ARTIFACT_NAME="QuiteNoteDev-${CI_COMMIT_SHORT_SHA}.zip"
    - ditto -c -k --keepParent "Quite Note Dev.app" "$ARTIFACT_NAME"
    - shasum -a 256 "$ARTIFACT_NAME" > "$ARTIFACT_NAME.sha256"
    - echo "UI_ARTIFACT=$ARTIFACT_NAME" >> build.env
  artifacts:
    name: "QuiteNoteDev-${CI_COMMIT_SHORT_SHA}"
    paths:
      - QuiteNoteDev-*.zip
      - QuiteNoteDev-*.zip.sha256
    expire_in: 7 days
    reports:
      dotenv: build.env

# xyz-mac UI 冒烟：拉取 dev-ui-artifact，远程执行并把报告/截图作为本版本产物保留
ui-smoke-remote:
  stage: ui-artifact
  tags: [macos]
  needs: [dev-ui-artifact]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      allow_failure: true
    - if: $CI_COMMIT_BRANCH
      allow_failure: true
  variables:
    REMOTE_HOST: "xyz-mac"
  script:
    - ARTIFACT_URL="$CI_PROJECT_DIR/$(ls QuiteNoteDev-*.zip | head -1)"
    - ./tools/ui-smoke/run_ui_smoke.sh --remote "$REMOTE_HOST" --artifact-url "$ARTIFACT_URL" --mode full
  artifacts:
    name: "QuiteNoteUI-${CI_COMMIT_SHORT_SHA}"
    paths:
      - tools/ui-smoke/runs/ui-*/manifest.json
      - tools/ui-smoke/runs/ui-*/report.json
      - tools/ui-smoke/runs/ui-*/report.md
      - tools/ui-smoke/runs/ui-*/timeline.jsonl
      - tools/ui-smoke/runs/ui-*/screenshots/
      - tools/ui-smoke/runs/ui-*/knowledge-candidate.md
    when: always
    expire_in: 30 days

# 打 v*.*.* 标签时：完整发布流水线
release-dmg:
  stage: release
  tags: [macos]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - echo "发布版本 $VERSION"
    - ./build-release.sh "$VERSION"
  artifacts:
    name: "QuiteNote-${CI_COMMIT_TAG}"
    paths:
      - QuiteNote-*.dmg
    expire_in: 30 days

metadata:
  name: "表情符号库"
  icon: "😊"
  priority: 3
  enabled: true

global:
  trigger_prefix: ":e"
  auto_hide: true
  auto_clean: true
  panel_position: "cursor_bottom"
  panel_width: "auto"

